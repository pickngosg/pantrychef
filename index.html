    try { var r = await sb.auth.getSession(); s = r.data && r.data.session; } catch (e) {}
    if (s) { boot(); return; }
    if (!navigator.onLine && hasStoredLogin() && await cached()) { boot(); return; }
    show('form', 'Sign in to open your kitchen.');
  }
  async function pw(mode) {
    err(''); var email = $('gateEmail').value.trim(), pass = $('gatePass').value;
    if (!email || !pass) return err('Please type your email and password.');
    if (mode === 'up' && pass.length < 8) return err('Please choose a password with 8 or more characters.');
    show('busy', 'One moment…');
    var r = mode === 'up' ? await sb.auth.signUp({ email: email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } }) : await sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) { show('form'); return err(r.error.message); }
    if (!r.data.session) { show('form', 'Check your email'); return err('We sent you an email. Tap the link in it, then come back and sign in.'); }
    boot();
  }
  $('gateForm').addEventListener('submit', function (e) { e.preventDefault(); pw('in'); });
  $('gateUp').addEventListener('click', function () { pw('up'); });
  $('gateGoogle').addEventListener('click', async function () {
    err(''); var r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } });
    if (r.error) err('Could not start Google sign-in. Try again.');
  });
  $('gateForgot').addEventListener('click', async function () {
    err(''); var email = $('gateEmail').value.trim(); if (!email) return err('Type your email above first, then tap Forgot my password.');
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (r.error) return err('Could not send the email. Please wait a minute and try again.');
    err('If that email has an account, a reset link is on its way. Check your inbox and spam.');
  });
  start();
})();
</script>
