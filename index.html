<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>PantryChef SG: Pantry, Recipes and Shopping List</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1E232A" />
  <meta name="copyright" content="PantryChef SG. All rights reserved.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="PantryChef SG: track your pantry, cut food waste, plan meals and compare Singapore supermarket prices." />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Styles: the ready-made file (tailwind.css, built by GitHub). No online fallback any more (safer). -->
  <link rel="stylesheet" href="tailwind.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50: '#FEF1EF', 100: '#FBE0DB', 200: '#F7C6BD', 300: '#EE8F80', 400: '#E05A47', 500: '#D14A38', 600: '#B93F2F', 700: '#9E3326', 800: '#7C281D', 900: '#5A1D15', 950: '#1E232A' } } } }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap');
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }

    /* ===== Motion (rows 21-28): fade, slide, scale only ===== */
    :root{--pc-ease:cubic-bezier(.22,.8,.3,1)}
    @keyframes pcRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes pcSheetUp{from{transform:translateY(44px);opacity:0}to{transform:none;opacity:1}}
    @keyframes pcSheetDown{to{transform:translateY(44px);opacity:0}}
    @keyframes pcFade{from{opacity:0}to{opacity:1}}
    @keyframes pcFadeOut{to{opacity:0}}
    @keyframes pcPop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
    @keyframes pcDraw{to{stroke-dashoffset:0}}
    .animate-fade-in{animation:fadeIn .2s var(--pc-ease) forwards}
    button:not(:disabled),[role="button"],summary{transition-property:scale,background-color,border-color,color,box-shadow,opacity;transition-duration:.15s;transition-timing-function:var(--pc-ease)}
    button:not(:disabled):active,[role="button"]:active{scale:.97}
    @media (hover:hover){
      .dash-tile:hover,#recipeGrid>*:hover,#pantryGrid>*:hover{translate:0 -2px}
      .dash-tile,#recipeGrid>*,#pantryGrid>*{transition-property:translate,box-shadow,scale;transition-duration:.15s;transition-timing-function:var(--pc-ease)}
    }
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(-n+10){animation:pcRise .28s var(--pc-ease) both}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(2){animation-delay:.03s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(3){animation-delay:.06s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(4){animation-delay:.09s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(5){animation-delay:.12s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(6){animation-delay:.15s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(7){animation-delay:.18s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(8){animation-delay:.21s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(9){animation-delay:.24s}
    .pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*:nth-child(10){animation-delay:.27s}
    #recipeDetailModal:not(.hidden){animation:pcFade .2s var(--pc-ease)}
    #recipeDetailModal:not(.hidden)>div{animation:pcFade .22s var(--pc-ease)}
    @media (max-width:639px){#recipeDetailModal:not(.hidden)>div{animation:pcSheetUp .26s var(--pc-ease)}}
    #recipeDetailModal.pc-closing{animation:pcFadeOut .18s ease-in forwards}
    #recipeDetailModal.pc-closing>div{animation:pcSheetDown .18s ease-in forwards}
    .pc-pop{animation:pcPop .3s var(--pc-ease)}
    @media (prefers-reduced-motion:reduce){
      .animate-fade-in,.pc-pop,.pc-stagger :is(#pantryGrid,#recipeGrid,#shoppingListContainer)>*,#recipeDetailModal,#recipeDetailModal>div,#recipeDetailModal.pc-closing,#recipeDetailModal.pc-closing>div{animation:none!important}
      button,[role="button"],summary,.dash-tile,#recipeGrid>*,#pantryGrid>*{transition:none!important}
      button:not(:disabled):active,[role="button"]:active,.dash-tile:hover,#recipeGrid>*:hover,#pantryGrid>*:hover{scale:none!important;translate:none!important}
    }
    /* ===== Cart compare table (row 19) ===== */
    .cmp-wrap td.cmp-item{width:112px;min-width:112px;max-width:112px;white-space:normal!important;overflow-wrap:anywhere;line-height:1.25;font-size:13px!important}
    .cmp-wrap td:not(.cmp-item){padding:8px 6px!important;font-size:13px!important;min-width:62px}
    .cmp-wrap th{white-space:normal!important;padding:6px 4px!important;font-size:11px!important;vertical-align:bottom}
    .cmp-nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    @media (min-width:640px){
      .cmp-wrap td.cmp-item{width:auto;min-width:0;max-width:260px;white-space:nowrap!important;overflow:hidden;text-overflow:ellipsis;font-size:14px!important}
      .cmp-wrap td:not(.cmp-item){padding:9px 10px!important;font-size:14px!important;min-width:0}
      .cmp-wrap th{white-space:nowrap!important;padding:8px 10px!important;font-size:12px!important}
      .cmp-nm{display:block;overflow:visible}
    }
    /* ===== Recipe screen (rows 15, 17, 18) ===== */
    #recipeDetailModal #btnTweakHealthy,#recipeDetailModal #btnTweakHalal,#recipeDetailModal #btnTweakProtein{font-size:13px!important;padding:8px 6px!important;line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;min-height:40px}
    @media (max-width:639px){
      #recipeDetailModal #detailBadges>*{font-size:12px!important;padding:3px 9px!important}
      #recipeDetailModal #btnTweakHealthy,#recipeDetailModal #btnTweakHalal,#recipeDetailModal #btnTweakProtein{font-size:12px!important;padding:6px 4px!important;min-height:36px}
      #detailIngredientsList{gap:8px}
      #detailIngredientsList > *{padding:10px 12px!important;font-size:15px!important}
    }
  

    .font-display{font-family:'Bricolage Grotesque','DM Sans',sans-serif}
    /* ---- Dashboard look ---- */
    #view-dashboard{position:relative;isolation:isolate}
    #view-dashboard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22 viewBox=%220 0 120 120%22%3E%3Cg fill=%22none%22 stroke=%22%23D14A38%22 stroke-opacity=%22.08%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M18 32c10-13 25-11 29 2-12 5-23 4-29-2z%22/%3E%3Cpath d=%22M82 88c10-13 25-11 29 2-12 5-23 4-29-2z%22/%3E%3Ccircle cx=%2290%22 cy=%2226%22 r=%225%22/%3E%3Ccircle cx=%2228%22 cy=%2294%22 r=%224%22/%3E%3Cpath d=%22M60 54v12M54 60h12%22/%3E%3Cpath d=%22M104 56l6 6M110 56l-6 6%22/%3E%3C/g%3E%3C/svg%3E");background-size:120px 120px}
    html.dark #view-dashboard::before{filter:invert(1);opacity:.55}
    .dash-hero{background:linear-gradient(135deg,#FDEAE5 0%,#FFF4D9 100%);border:1px solid rgba(209,74,56,.14);box-shadow:0 6px 24px -12px rgba(158,51,38,.35)}
    html.dark .dash-hero{background:linear-gradient(135deg,#2A2220 0%,#2B2410 100%);border-color:rgba(255,255,255,.08)}
    .dash-hero-ico{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;background:rgba(255,255,255,.7);flex-shrink:0}
    html.dark .dash-hero-ico{background:rgba(255,255,255,.08)}

    .dash-pot{width:104px;height:104px;flex-shrink:0;display:block}
    .dash-pot svg{width:100%;height:100%;overflow:visible;display:block}
    .dash-pot svg *{transform-box:fill-box;transform-origin:center}
    .dash-pot .pt-pot{transform-origin:50% 100%}
    .pt-b{stroke:#B9958A;stroke-width:3;stroke-linejoin:round}
    .dash-pot [stroke="#EDA99B"]{stroke:#D8715E}
    .dash-pot svg{filter:drop-shadow(0 3px 4px rgba(158,51,38,.22))}
    html.dark .pt-b{stroke:#E6D9D2;stroke-width:2.5}
    html.dark .dash-pot [stroke="#EDA99B"]{stroke:#EDA99B}
    html.dark .dash-pot svg{filter:none}
    .pt-calm .pt-pot,.pt-sleepy .pt-pot{animation:ptBreathe 4s ease-in-out infinite}
    .pt-calm .pt-lid{animation:ptLid 4s ease-in-out infinite}
    .pt-calm .pt-curl{animation:ptDrift 4s ease-in-out infinite}.pt-calm .pt-curl.r{animation-delay:-2s}
    .pt-worried .pt-lid{animation:ptRattle 2s linear infinite}
    .pt-worried .pt-mouth{animation:ptWob 2s linear infinite}
    .pt-worried .pt-ring{animation:ptPulse 1s ease-in-out infinite}
    .pt-worried .pt-wisp{animation:ptRise 2s ease-out infinite}.pt-worried .pt-wisp.b{animation-delay:-.67s}.pt-worried .pt-wisp.c{animation-delay:-1.33s}
    .pt-happy .pt-pot{animation:ptHop 2s ease-in-out infinite}
    .pt-happy .pt-spark{animation:ptTwinkle 1s ease-in-out infinite}.pt-happy .pt-spark.b{animation-delay:-.5s}
    .pt-sleepy .pt-z{animation:ptZ 4s ease-in-out infinite}.pt-sleepy .pt-z.b{animation-delay:-2s}
    .pt-sleepy .pt-snore{animation:ptSnore 4s ease-in-out infinite}
    @keyframes ptBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
    @keyframes ptLid{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
    @keyframes ptDrift{0%,100%{transform:translateY(2px);opacity:.8}50%{transform:translateY(-4px);opacity:1}}
    @keyframes ptRattle{0%{transform:translate(0,0) rotate(0)}4%{transform:translate(-1px,-3px) rotate(-3deg)}8%{transform:translate(1px,-1px) rotate(3deg)}12%{transform:translate(-1px,-4px) rotate(-3deg)}16%{transform:translate(1px,-1px) rotate(3deg)}20%{transform:translate(-1px,-3px) rotate(-2deg)}24%{transform:translate(1px,-1px) rotate(2deg)}28%{transform:translate(0,-2px) rotate(-1deg)}34%,100%{transform:translate(0,0) rotate(0)}}
    @keyframes ptWob{0%{transform:translateX(0)}4%{transform:translateX(-1.5px)}8%{transform:translateX(1.5px)}12%{transform:translateX(-1.5px)}16%{transform:translateX(1.5px)}20%{transform:translateX(-1px)}24%{transform:translateX(1px)}30%,100%{transform:translateX(0)}}
    @keyframes ptPulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
    @keyframes ptRise{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
    @keyframes ptHop{0%,40%,100%{transform:translateY(0) scale(1,1)}8%{transform:translateY(0) scale(1.05,.93)}22%{transform:translateY(-10px) scale(.97,1.04)}36%{transform:translateY(0) scale(1.04,.95)}}
    @keyframes ptTwinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
    @keyframes ptZ{0%{transform:translate(0,8px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
    @keyframes ptSnore{0%,100%{transform:scale(.8)}50%{transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){.dash-pot *{animation:none!important}}
    .dash-ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
    .tn-green{background:#FBE0DB}.tn-amber{background:#FBEBC3}.tn-orange{background:#FDDCC4}.tn-blue{background:#D6E8FA}.tn-rose{background:#FADADD}.tn-violet{background:#E8DDF8}
    html.dark .tn-green,html.dark .tn-amber,html.dark .tn-orange,html.dark .tn-blue,html.dark .tn-rose,html.dark .tn-violet{background:rgba(255,255,255,.09)}
    .dash-tile{border-bottom:4px solid transparent;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px -6px rgba(15,23,42,.35)}
    .dash-tile:active{transform:scale(.97)}
    .dash-tile.c-green{border-bottom-color:#3D7D54}.dash-tile.c-amber{border-bottom-color:#D99A06}.dash-tile.c-orange{border-bottom-color:#E8691E}.dash-tile.c-blue{border-bottom-color:#2B7BD1}
    .dash-card{box-shadow:0 2px 12px -8px rgba(15,23,42,.4)}
    .dash-sec{display:flex;align-items:center;gap:10px}
    .cal-ring{--p:0;--c:#D14A38;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),#E4E7E2 0);display:grid;place-items:center;flex-shrink:0}
    html.dark .cal-ring{background:conic-gradient(var(--c) calc(var(--p) * 1%),#353C45 0)}
    .cal-ring-in{width:102px;height:102px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
    html.dark .cal-ring-in{background:#15191E}
    .macro-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}

    .bg-brand-500.text-slate-950{color:#fff!important}
    #statTotalPantry,#statExpiringSoon,#statReadyRecipes,#statCartCount{display:block}

    @media (min-width:768px){
      #btnOpenDataBackupModal,#btnOpenCommandPalette{display:none!important}
      header nav .side-extra.side-top{margin-top:0;margin-bottom:10px}
      header nav .side-extra{display:flex;align-items:center;gap:12px;width:100%;margin-top:auto;padding:12px 14px;border-radius:10px;border:1px solid #3A424D;background:#2A3039;color:#F9F8F6;font-size:15px;font-weight:700;text-align:left;cursor:pointer}
      header nav .side-extra:hover{background:#27402F}
      #navQuickCommands{margin-top:auto}
      #navPlanChip,#navBackupSync{margin-top:0}
      #navBackupSync{margin-top:0}
    }

    /* ===== Recipe view: larger, easier-to-read text ===== */
    #recipeDetailModal .text-\[9px\],#recipeDetailModal .text-\[10px\],#recipeDetailModal .text-\[11px\]{font-size:14px!important}
    #recipeDetailModal .text-xs{font-size:16px!important}
    #recipeDetailModal .text-sm{font-size:18px!important}
    #recipeDetailModal .text-base{font-size:20px!important}
    #detailRecipeTitle{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:clamp(26px,3.2vw,38px)!important;line-height:1.15;letter-spacing:-0.02em}
    #detailBadges{gap:8px!important;margin-bottom:10px!important}
    #detailBadges > *{font-size:14px!important;padding:6px 12px!important;border-radius:10px!important}
    #recipeDetailModal h4{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:20px!important;font-weight:700!important;text-transform:none!important;letter-spacing:-0.01em!important;color:#1E232A!important;margin-bottom:12px!important}
    html.dark #recipeDetailModal h4{color:#F9F8F6!important}
    #recipeDetailModal [class*="overflow-y-auto"]{padding:24px!important}
    #detailIngredientsList{gap:10px;display:flex;flex-direction:column}
    #detailIngredientsList > *{padding:14px 18px!important;font-size:17px!important}
    #detailStepsList{font-size:17px!important;line-height:1.7}
    #detailStepsList > li{padding:14px 18px!important;margin-bottom:10px}
    #btnPaxMinus,#btnPaxPlus{width:42px!important;height:42px!important;font-size:20px!important}
    #detailPaxCount{font-size:22px!important;width:36px!important}
    #btnTweakHealthy,#btnTweakHalal,#btnTweakProtein{font-size:14px!important;padding:10px 14px!important}
    #detailTweakBanner{font-size:15px!important;padding:14px 18px!important}
    #btnEditCurrentRecipeFromDetail{font-size:15px!important;padding:10px 16px!important}
    #closeRecipeDetailModalBtn{width:42px!important;height:42px!important;font-size:16px!important}
    #btnLogAndDeductRecipe,#btnStartCookingMode{font-size:16px!important;padding:12px 10px!important}
    #btnPushMissingToCart,#btnTidyIngredients{font-size:14px!important;padding:9px 14px!important}
    #btnTidyIngredients{display:none!important}
    #navPlanChip.pc-owner{display:none!important}
    .pc-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:#F1F3EF}
    html.dark .pc-seg{background:#1E2B23}
    .pc-seg button{padding:11px 6px;border-radius:10px;border:0;background:none;font-weight:800;font-size:14.5px;color:inherit}
    .pc-seg button[aria-pressed=true]{background:#fff;color:#D14A38;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    html.dark .pc-seg button[aria-pressed=true]{background:#162019}
    html.pc-tfade,html.pc-tfade *{transition:background-color .5s ease,color .5s ease,border-color .5s ease!important}
    /* Planner (rows 48-51) */
    #view-planner{max-width:1180px!important}
    .pp-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
    .pp-strip::-webkit-scrollbar{display:none}
    .pp-day{flex:1 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:16px;border:2px solid transparent;background:#F1F3EF;font-weight:800;font-size:13px;color:#334}
    html.dark .pp-day{background:#1E2B23;color:#D5DDD8}
    .pp-day[aria-pressed=true]{border-color:#D14A38;background:#FDF1EE}
    html.dark .pp-day[aria-pressed=true]{background:#2A1A17}
    .pp-day.today span.pp-n{color:#D14A38}
    .pp-ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(#D14A38 calc(var(--p)*1%),#DDE1DC 0);display:flex;align-items:center;justify-content:center;transition:--p .6s ease}
    html.dark .pp-ring{background:conic-gradient(#D14A38 calc(var(--p)*1%),#353C45 0)}
    .pp-ring i{width:24px;height:24px;border-radius:50%;background:#fff;display:block}
    html.dark .pp-ring i{background:#15191E}
    .pp-sum{font-weight:800;font-size:16px;color:#1E232A;padding:4px 2px}
    html.dark .pp-sum{color:#F1F5F2}
    .pp-days{display:grid;gap:12px}
    .pp-sw{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:#F1F3EF}
    html.dark .pp-sw{background:#1E2B23}
    .pp-sw button{padding:9px 16px;border-radius:10px;border:0;background:none;font-weight:800;font-size:15px;color:inherit}
    .pp-sw button[aria-pressed=true]{background:#fff;color:#D14A38;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    html.dark .pp-sw button[aria-pressed=true]{background:#162019}
    .pp-tblwrap{overflow-x:auto}
    .pp-tbl{width:100%;border-collapse:separate;border-spacing:0 8px;table-layout:fixed;min-width:900px}
    .pp-tbl th{text-align:left;font-size:13px;font-weight:800;color:#6B7A72;text-transform:uppercase;letter-spacing:.04em;padding:0 8px}
    .pp-tbl tbody th{font-size:16px;text-transform:none;letter-spacing:0;color:inherit;width:120px;vertical-align:middle}
    .pp-tbl tbody th small{display:block;color:#D14A38;font-size:12px}
    .pp-tbl td{padding:4px;background:#fff;vertical-align:middle}
    html.dark .pp-tbl td{background:#162019}
    .pp-tbl td:first-of-type{border-radius:0}
    .pp-tbl td.tot{width:120px;font-size:14px;color:#51605A;padding-left:12px}
    .pp-tbl .pp-slot,.pp-tbl .pp-add{height:96px;box-sizing:border-box}
    .pp-tbl .pp-slot small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pp-days .pp-slot,.pp-days .pp-add{min-height:84px}
    .pp-pb{display:block;height:5px;border-radius:3px;background:#DDE1DC;margin-top:5px;overflow:hidden}
    html.dark .pp-pb{background:#353C45}
    .pp-pb i{display:block;height:100%;width:calc(var(--p)*1%);background:#3B8C6A;border-radius:3px}
    .pp-tbl tr.today td{background:#FDF1EE}
    html.dark .pp-tbl tr.today td{background:#2A1A17}
    .pp-days.big .pp-col{grid-template-columns:repeat(3,1fr);gap:14px}
    .pp-days.big .pp-col h4{grid-column:1/-1}
    .pp-days.big .pp-slot{flex-direction:column;align-items:flex-start}
    .pp-days.big .pp-slot img{width:100%;height:150px}
    .pp-days.big .pp-slot b{font-size:17px}
    .pp-two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
    .pp-ov{display:grid;gap:8px}
    .pp-ovr{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid transparent;background:#F1F3EF;color:inherit}
    html.dark .pp-ovr{background:#1E2B23}
    .pp-ovr[aria-pressed=true]{border-color:#D14A38}
    .pp-meals{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
